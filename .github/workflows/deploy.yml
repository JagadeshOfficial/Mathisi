name: Deploy Mathisi with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to GoDaddy VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          request_pty: true
          command_timeout: 60m
          script: |
            export PATH="/usr/bin:/usr/local/bin:/usr/libexec/docker/cli-plugins:$PATH"
            
            TARGET_DIR="$HOME/mathisi.in"
            mkdir -p $TARGET_DIR

            # Clone or Sync repository
            if [ ! -d "$TARGET_DIR/.git" ]; then
              git clone https://github.com/JagadeshOfficial/Mathisi.git $TARGET_DIR
            fi

            cd $TARGET_DIR
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Deploy with Docker & Docker Compose (matching Intelskill architecture)
            if command -v docker >/dev/null 2>&1; then
              echo "Deploying Docker containers for mathisi.in..."
              docker compose down --remove-orphans 2>/dev/null || docker-compose down 2>/dev/null || true
              docker compose up -d --build 2>/dev/null || docker-compose up -d --build 2>/dev/null || true
              docker image prune -f 2>/dev/null || true
            fi

            echo "Mathisi Docker Deployment Completed Successfully!"



