name: Deploy Next.js with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to GoDaddy Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          command_timeout: 60m
            # --- Load NVM & Shell Profile ---
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.profile" ] && \. "$HOME/.profile"
            [ -s "$HOME/.bashrc" ] && \. "$HOME/.bashrc"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/opt/alt/node20/bin:/opt/alt/node18/bin:/opt/alt/node16/bin
            
            # Set target directory
            TARGET_DIR="~/Mathisi"
            mkdir -p $TARGET_DIR
            
            # --- Cleanup Locks ---
            echo "Cleaning up locks..."
            rm -f $TARGET_DIR/.git/index.lock
            
            # --- Clone / Sync Repo ---
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/JagadeshOfficial/Mathisi.git $TARGET_DIR
            fi
            
            cd $TARGET_DIR
            echo "Syncing with GitHub..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            # --- Build & Deploy ---
            if command -v docker >/dev/null 2>&1; then
              echo "Deploying with Docker Compose..."
              docker compose down --remove-orphans || true
              docker compose up -d --build
              echo "Pruning unused images..."
              docker image prune -f
            else
              echo "Docker not found in PATH on server. Deploying with Node & PM2..."
              npm install
              npm run build
              npx pm2 restart mathisi || npx pm2 start npm --name "mathisi" -- run start -- -p 9002
              npx pm2 save
            fi

