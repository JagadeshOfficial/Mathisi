name: Deploy Next.js with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to GoDaddy Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          command_timeout: 60m
          script: |
            # --- Auto-discover Node, NPM, and Docker paths ---
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.bash_profile" ] && \. "$HOME/.bash_profile"
            [ -s "$HOME/.profile" ] && \. "$HOME/.profile"
            [ -s "$HOME/.bashrc" ] && \. "$HOME/.bashrc"
            
            NPM_BIN=$(find /home /usr /opt /var -name npm 2>/dev/null | head -n 1)
            if [ -n "$NPM_BIN" ]; then
              export PATH="$(dirname "$NPM_BIN"):$PATH"
            fi
            
            # --- Auto-install Node.js & NVM if missing ---
            if ! command -v npm >/dev/null 2>&1; then
              echo "NPM not found. Installing Node.js & NVM automatically..."
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm install 20
              nvm use 20
            fi
            
            # Set target directory
            TARGET_DIR="~/Mathisi"
            mkdir -p $TARGET_DIR
            
            # --- Cleanup Locks ---
            echo "Cleaning up locks..."
            rm -f $TARGET_DIR/.git/index.lock
            
            # --- Clone / Sync Repo ---
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/JagadeshOfficial/Mathisi.git $TARGET_DIR
            fi
            
            cd $TARGET_DIR
            echo "Syncing with GitHub..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            # --- Build & Deploy ---
            if command -v docker >/dev/null 2>&1; then
              echo "Deploying with Docker Compose..."
              docker compose down --remove-orphans || true
              docker compose up -d --build
              echo "Pruning unused images..."
              docker image prune -f
            else
              echo "Deploying with Node & PM2..."
              npm install
              npm run build
              npx pm2 restart mathisi || npx pm2 start npm --name "mathisi" -- run start -- -p 9002
              npx pm2 save

              # Nginx Reverse Proxy Configuration for mathisi.in
              if command -v nginx >/dev/null 2>&1; then
                echo "Updating Nginx reverse proxy configuration for mathisi.in..."
                sudo bash -c 'cat << "EOF" > /etc/nginx/sites-available/mathisi.in
server {
    listen 80;
    server_name mathisi.in www.mathisi.in 68.178.173.224 _;

    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
EOF' || true
                sudo ln -sf /etc/nginx/sites-available/mathisi.in /etc/nginx/sites-enabled/mathisi.in 2>/dev/null || true
                sudo nginx -t && (sudo systemctl reload nginx 2>/dev/null || sudo service nginx reload 2>/dev/null) || true
              fi
            fi

