name: Deploy Next.js with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to GoDaddy Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          request_pty: true
          command_timeout: 60m
          script: |
            # --- Auto-discover Node, NPM, and Docker paths ---
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.bash_profile" ] && \. "$HOME/.bash_profile"
            [ -s "$HOME/.profile" ] && \. "$HOME/.profile"
            [ -s "$HOME/.bashrc" ] && \. "$HOME/.bashrc"
            
            NPM_BIN=$(find /home /usr /opt /var -name npm 2>/dev/null | head -n 1)
            if [ -n "$NPM_BIN" ]; then
              export PATH="$(dirname "$NPM_BIN"):$PATH"
            fi
            
            # --- Auto-install Node.js & NVM if missing ---
            if ! command -v npm >/dev/null 2>&1; then
              echo "NPM not found. Installing Node.js & NVM automatically..."
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm install 20
              nvm use 20
            fi
            
            # Set target directory
            TARGET_DIR="~/Mathisi"
            mkdir -p $TARGET_DIR
            
            # --- Cleanup Locks ---
            echo "Cleaning up locks..."
            rm -f $TARGET_DIR/.git/index.lock
            
            # --- Clone / Sync Repo ---
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/JagadeshOfficial/Mathisi.git $TARGET_DIR
            fi
            
            cd $TARGET_DIR
            echo "Syncing with GitHub..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            # --- Auto-install Docker & Docker Compose if missing ---
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found on server. Installing Docker automatically..."
              SUDO_PASS="${{ secrets.PASSWORD }}"
              echo "$SUDO_PASS" | sudo -S yum install -y docker docker-compose 2>/dev/null || \
              (echo "$SUDO_PASS" | sudo -S apt-get update && echo "$SUDO_PASS" | sudo -S apt-get install -y docker.io docker-compose 2>/dev/null) || \
              (curl -fsSL https://get.docker.com | echo "$SUDO_PASS" | sudo -S sh) || true
              
              echo "$SUDO_PASS" | sudo -S systemctl enable --now docker || true
              echo "$SUDO_PASS" | sudo -S usermod -aG docker $USER || true
            fi

            # --- Docker Build & Deploy ---
            if command -v docker >/dev/null 2>&1; then
              echo "Deploying container with Docker Compose..."
              docker compose down --remove-orphans || true
              docker compose up -d --build
              echo "Pruning unused images..."
              docker image prune -f
              echo "Running Docker containers:"
              docker ps
            else
              echo "Deploying with Node & PM2..."
              npm install
              npm run build
              
              # Prepare standalone distribution assets
              cp -r public .next/standalone/ 2>/dev/null || true
              cp -r .next/static .next/standalone/.next/ 2>/dev/null || true

              # Copy distribution assets to Nginx / GoDaddy public webroots (fixes 404)
              for target in "$HOME/public_html" "/var/www/html" "/home/$USER/public_html"; do
                if [ -d "$target" ] || mkdir -p "$target" 2>/dev/null; then
                  echo "Syncing assets to webroot: $target"
                  cp -r public/* "$target/" 2>/dev/null || true
                  cp -r .next/standalone/* "$target/" 2>/dev/null || true
                fi
              done

              # Reset old PM2 processes
              npx pm2 delete all 2>/dev/null || true

              # Launch standalone Next.js server on port 9002 and 3000
              PORT=9002 HOSTNAME=0.0.0.0 npx pm2 start .next/standalone/server.js --name "mathisi"
              PORT=3000 HOSTNAME=0.0.0.0 npx pm2 start .next/standalone/server.js --name "mathisi-3000"
              npx pm2 save

              # Nginx Reverse Proxy Configuration
              SUDO_PASSWORD="${{ secrets.PASSWORD }}" bash scripts/setup-nginx.sh || true
            fi

