name: Deploy Next.js with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to GoDaddy Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          request_pty: true
          command_timeout: 60m
          script: |
            # --- Auto-discover Node and NPM paths ---
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.bash_profile" ] && \. "$HOME/.bash_profile"
            [ -s "$HOME/.profile" ] && \. "$HOME/.profile"
            [ -s "$HOME/.bashrc" ] && \. "$HOME/.bashrc"
            
            NPM_BIN=$(find /home /usr /opt /var -name npm 2>/dev/null | head -n 1)
            if [ -n "$NPM_BIN" ]; then
              export PATH="$(dirname "$NPM_BIN"):$PATH"
            fi
            
            # --- Auto-install Node.js & NVM if missing ---
            if ! command -v npm >/dev/null 2>&1; then
              echo "NPM not found. Installing Node.js & NVM automatically..."
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm install 20
              nvm use 20
            fi
            
            # Set target directory
            TARGET_DIR="~/Mathisi"
            mkdir -p $TARGET_DIR
            
            # --- Cleanup Locks ---
            echo "Cleaning up locks..."
            rm -f $TARGET_DIR/.git/index.lock
            
            # --- Clone / Sync Repo ---
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/JagadeshOfficial/Mathisi.git $TARGET_DIR
            fi
            
            cd $TARGET_DIR
            echo "Syncing with GitHub..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # --- Next.js Build & PM2 Deploy ---
            echo "Deploying Next.js standalone server with PM2..."
            npm install
            npm run build
            
            # Prepare standalone distribution assets
            cp -r public .next/standalone/ 2>/dev/null || true
            cp -r .next/static .next/standalone/.next/ 2>/dev/null || true

            # Launch standalone Next.js server via PM2 on port 9002
            PORT=9002 HOSTNAME=0.0.0.0 npx pm2 restart mathisi || PORT=9002 HOSTNAME=0.0.0.0 npx pm2 start .next/standalone/server.js --name "mathisi"
            npx pm2 save

            # Write cPanel / PHP reverse proxy to ~/public_html
            mkdir -p "$HOME/public_html" 2>/dev/null || true
            printf 'DirectoryIndex index.php\nRewriteEngine On\nRewriteCond %%{REQUEST_FILENAME} !-f\nRewriteCond %%{REQUEST_FILENAME} !-d\nRewriteRule ^(.*)$ index.php [QSA,L]\n' > "$HOME/public_html/.htaccess"
            printf '<?php\n$target = "http://127.0.0.1:9002" . $_SERVER["REQUEST_URI"];\n$ch = curl_init($target);\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\ncurl_setopt($ch, CURLOPT_HEADER, true);\ncurl_setopt($ch, CURLOPT_FOLLOWLOCATION, true);\n$response = curl_exec($ch);\n$header_size = curl_getinfo($ch, CURLINFO_HEADER_SIZE);\n$header = substr($response, 0, $header_size);\n$body = substr($response, $header_size);\ncurl_close($ch);\nforeach (explode("\\r\\n", $header) as $hdr) {\n    if (!empty($hdr) && !str_contains(strtolower($hdr), "transfer-encoding")) {\n        header($hdr);\n    }\n}\necho $body;\n' > "$HOME/public_html/index.php"

            echo "Standalone Next.js server and PHP proxy deployed successfully!"
